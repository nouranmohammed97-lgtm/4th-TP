<style>

.slide.on{display:flex}
h1,h2{margin:0;font-weight:600}
h1{font-size:7cqw}h2{font-size:3.4cqw}
.tag{display:inline-block;background:var(--o);color:#fff;border-radius:2cqw;padding:.3cqw 1.6cqw;font-size:1.8cqw;align-self:flex-start;margin-bottom:1cqw}
.big{font-size:9cqw;line-height:1}
button{font:inherit;cursor:pointer;border:.25cqw solid var(--k);background:#fff;color:var(--k);border-radius:1.2cqw;padding:.8cqw 2cqw}
button:hover{background:var(--o2)}button:focus-visible{outline:.4cqw solid var(--o);outline-offset:.3cqw}
.pri{background:var(--o);color:#fff;border-color:var(--o)}.pri:hover{background:#9a3412}
.row{display:flex;gap:2cqw;align-items:center}
.obj{display:flex;gap:2cqw;align-items:center;font-size:3cqw;margin:1.2cqw 0}.obj span{font-size:4.5cqw}
/* lead-in */

.panel{flex:1;border:.3cqw solid var(--k);border-radius:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:1cqw;background:var(--o2)}
.panel .pic{font-size:9cqw}.panel .cap{font-size:2.6cqw}
.rx{width:11cqw;height:11cqw;border-radius:50%;border:.3cqw dashed var(--o);display:flex;align-items:center;justify-content:center;font-size:6.5cqw;color:var(--o);cursor:pointer;background:#fff}
.rx.open{border-style:solid}
/* word cards */
.flipwrap{flex:1;perspective:200cqw;margin-top:1cqw;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flipwrap.flip .card{transform:rotateY(180deg)}

.pic{font-size:15cqw;flex:0 0 22cqw;text-align:center}
.rows{display:flex;flex-direction:column;gap:1.6cqw;flex:1}
.r{display:flex;gap:1.5cqw;align-items:baseline;font-size:2.7cqw}
.r b{flex:0 0 14cqw;color:var(--o);font-weight:600;font-size:2.2cqw}
.chk{cursor:pointer;border-bottom:.2cqw dashed var(--o)}

.hint{color:var(--g);font-size:1.8cqw;text-align:center;margin-top:1cqw}
.back .r{font-size:3cqw}
